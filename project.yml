# XcodeGen の設定ファイル。GitHub Actions がこれから Xcode プロジェクトを自動生成します。
name: MyCipher
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  MyCipher:
    type: application
    platform: iOS
    sources:
      - path: MyCipher
        excludes:
          - NexKanaCipherTests.swift   # テストはアプリに含めない
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mycipher
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MyCipher
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  MyCipherTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MyCipher
        includes:
          - NexKanaCipherTests.swift   # 既存方式とAESのテスト
    dependencies:
      - target: MyCipher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mycipher.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MyCipher:
    build:
      targets:
        MyCipher: all
    test:
      targets:
        - MyCipherTests
