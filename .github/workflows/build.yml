name: Build MyCipher

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # GitHubの画面から手動実行もできる

jobs:
  build:
    # Liquid Glass（iOS 26 SDK）には Xcode 26 が必要
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Xcode のバージョン確認
        run: xcodebuild -version

      - name: XcodeGen をインストール
        run: brew install xcodegen

      - name: Xcode プロジェクトを生成
        run: xcodegen generate

      - name: テスト（暗号ロジック）
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          for rt,devs in d.items():
              if 'iOS' in rt:
                  for x in devs:
                      if 'iPhone' in x['name']:
                          print(x['udid']); sys.exit()
          ")
          xcodebuild test \
            -project MyCipher.xcodeproj -scheme MyCipher \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO

      - name: 署名なしでビルド
        run: |
          xcodebuild build \
            -project MyCipher.xcodeproj -scheme MyCipher \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: IPA を作る
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MyCipher.app Payload/
          zip -qr MyCipher-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MyCipher-unsigned-ipa
          path: MyCipher-unsigned.ipa